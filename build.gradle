plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "MarketBox"
}

loom {
    // GameTest 运行配置：无头启动服务端跑测试，不需要显卡，CI 可用
    // 用法：./gradlew runGameTest
    runs {
        gameTest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gameTest"
        }
        // 开发调试：./gradlew runClient -PquickPlayWorld="存档名" 可直接进入世界
        client {
            if (project.hasProperty('quickPlayWorld')) {
                programArgs "--quickPlaySingleplayer", project.property('quickPlayWorld').toString()
            }
        }
    }
}

repositories {
    mavenCentral()
    // Mod Menu 的发布仓库（仅编译期取 API）
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 使用 Mojang 官方映射：与旧工程类名一致（Level/ServerPlayer/ItemStack 等），降低迁移成本
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu：仅编译期引用其 API，属于可选前置，未安装时不加载入口点
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // 开发环境自动带上 Mod Menu，方便在 runClient 中验证配置入口
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// 将版本信息注入 fabric.mod.json
processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", project.mod_id

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mod_id": project.mod_id
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    // Minecraft 1.21.1 要求 Java 21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // 不生成 sources jar：交付物只保留可安装的模组 jar
}

jar {
    inputs.property "archivesName", project.base.archivesName.get()
}

// ---- 版本迭代与产物清理 ----

/**
 * 递增补丁版本号（4.7.3 -> 4.7.4），直接改 gradle.properties 中的一行，保留文件其余格式。
 * 用法：./gradlew bumpVersion
 */
tasks.register('bumpVersion') {
    doLast {
        def propsFile = file('gradle.properties')
        def text = propsFile.text
        def matcher = text =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+)(.*)$/
        if (!matcher.find()) {
            throw new GradleException("gradle.properties 中未找到可解析的 mod_version")
        }
        def next = "${matcher.group(1)}.${matcher.group(2)}.${matcher.group(3).toInteger() + 1}${matcher.group(4)}"
        propsFile.text = text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}".toString())
        println "[MarketBox] 版本号：${matcher.group(0).replace('mod_version=', '')} -> ${next}"
    }
}

/**
 * 递增次版本号（4.7.3 -> 4.8.0）。
 * 用于新增功能模块，向后兼容。
 * 用法：./gradlew bumpMinor
 */
tasks.register('bumpMinor') {
    doLast {
        def propsFile = file('gradle.properties')
        def text = propsFile.text
        def matcher = text =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+).*$/
        if (!matcher.find()) {
            throw new GradleException("gradle.properties 中未找到可解析的 mod_version")
        }
        def next = "${matcher.group(1)}.${matcher.group(2).toInteger() + 1}.0"
        def prev = matcher.group(0).replace('mod_version=', '')
        propsFile.text = text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}".toString())
        println "[MarketBox] 版本号：${prev} -> ${next}（次版本，新增功能）"
    }
}

/**
 * 递增主版本号（4.7.3 -> 5.0.0）。
 * 用于不向后兼容的大改：存档格式变更、经济模型重做、接口重构等。
 * 用法：./gradlew bumpMajor
 */
tasks.register('bumpMajor') {
    doLast {
        def propsFile = file('gradle.properties')
        def text = propsFile.text
        def matcher = text =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+).*$/
        if (!matcher.find()) {
            throw new GradleException("gradle.properties 中未找到可解析的 mod_version")
        }
        def next = "${matcher.group(1).toInteger() + 1}.0.0"
        def prev = matcher.group(0).replace('mod_version=', '')
        propsFile.text = text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}".toString())
        println "[MarketBox] 版本号：${prev} -> ${next}（主版本，不兼容改动）"
    }
}

/**
 * 构建结束后清理 build/libs 里的旧版本产物，只保留本次构建的 jar。
 * 避免反复构建后 libs 目录堆积多个历史版本。
 */
tasks.register('pruneOldJars') {
    doLast {
        def dir = layout.buildDirectory.dir('libs').get().asFile
        if (!dir.exists()) {
            return
        }
        def current = "${base.archivesName.get()}-${project.version}"
        def removed = []
        dir.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !f.name.startsWith(current)) {
                if (f.delete()) {
                    removed << f.name
                }
            }
        }
        if (!removed.isEmpty()) {
            println "[MarketBox] 已清理旧产物：${removed.join(', ')}"
        }
        println "[MarketBox] 当前产物：${current}.jar"
    }
}

tasks.named('build') {
    finalizedBy 'pruneOldJars'
}

/**
 * 项目规则自检，对应 AGENTS.txt 里的硬性约束。
 * 违反时构建失败，避免规则只停留在文档里。
 */
tasks.register('checkRules') {
    group = 'verification'
    description = '检查 AGENTS.txt 中的硬性规则'

    doLast {
        def violations = []

        // 四.2：单个 Java 文件不得超过 500 行
        fileTree('src/main/java').matching { include '**/*.java' }.each { f ->
            def lineCount = f.readLines().size()
            if (lineCount > 500) {
                violations << "  [四.2] ${f.path} 共 ${lineCount} 行，超过 500 行上限"
            }
        }

        // 二.7：不得新增操作指南 / 说明类 md 文档（README 与许可证除外）
        def allowedMd = ['README.md', 'THIRD_PARTY_NOTICES.md', 'LICENSE.md']
        fileTree('.').matching {
            include '*.md'
            exclude 'build/**'
            exclude '.workbuddy/**'
        }.each { f ->
            if (!allowedMd.contains(f.name)) {
                violations << "  [二.7] 根目录出现额外 md 文档：${f.name}"
            }
        }

        // 三.1 的对应检查：服务端包不得引用客户端类
        fileTree('src/main/java/com/koko/marketbox').matching {
            include '**/*.java'
            exclude 'client/**'
        }.each { f ->
            f.readLines().eachWithIndex { line, idx ->
                if (line.contains('com.koko.marketbox.client.') && !line.trim().startsWith('*')) {
                    violations << "  [跨端] ${f.name}:${idx + 1} 引用了客户端包"
                }
            }
        }

        if (!violations.isEmpty()) {
            println "\n[checkRules] 发现 ${violations.size()} 处违规："
            violations.each { println it }
            throw new GradleException("存在违反项目规则的代码，请先修复")
        }
        println "[checkRules] 全部通过"
    }
}

tasks.named('build') {
    dependsOn 'checkRules'
}

